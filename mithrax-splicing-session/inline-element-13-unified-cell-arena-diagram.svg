<svg class="dark " xmlns="http://www.w3.org/2000/svg" viewBox="0 0 661.25 359" width="661.25" height="359">
  <style>:root, .light {
    --_lm: ;
    --_dm: initial;
    --bg: #ffffff;
    --fg: #1f1f1f;
    --line: #545454;
    --accent: #1a73e8;
    --surface: #f8f9fa;
    --border: #747775;
  }

  .dark {
    --_lm: initial;
    --_dm: ;
    --bg: #1f1f1f;
    --fg: #e3e3e3;
    --line: #bfbfbf;
    --accent: #8ab4f8;
    --surface: #2d2e30;
    --border: #8e918f;
  }
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Mono:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Google Sans Mono', sans-serif; }
  svg {
    --_text:          var(--primaryTextColor, var(--fg));
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--lineColor, var(--defaultLinkColor, var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)))));
    --_arrow:         var(--_line);
    --_node-fill:     var(--primaryColor, var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg))));
    --_node-stroke:   var(--primaryBorderColor, var(--nodeBorder, var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)))));
    --_group-fill:    var(--surface, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  var(--_node-stroke);
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }</style>
  <defs>
    <style>text { font-family: "Google Sans Mono", monospace; font-size: 13px; dominant-baseline: central; white-space: pre; }
.outer-box { fill: color-mix(in srgb, var(--fg) 6%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.75px; }
.rect-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.stadium-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; }
.hex-pill { fill: var(--bg); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.diamond-box { fill: color-mix(in srgb, var(--fg) 9%, transparent); stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.5px; stroke-linejoin: round; stroke-linecap: round; }
.header-text { font-size: 14px; font-weight: 600; fill: var(--_text); }
.label-text { font-size: 13px; font-weight: 500; fill: var(--_text); }
.annotation-text { font-size: 12px; font-weight: 500; fill: var(--_text); }
.arrow-line, .bus-line { stroke: var(--_line); stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.divider-line { stroke: var(--primaryBorderColor, var(--nodeBorder, var(--border, var(--_node-stroke)))); stroke-width: 1.0px; stroke-opacity: 0.75; }</style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="var(--_arrow)"/>
    </marker>
  </defs>
  <g class="shape outer cluster">
    <rect x="85.15" y="15" width="467.5" height="88" rx="0" ry="0" class="outer-box"/>
    <text x="314.65" y="37" class="header-text" text-anchor="middle" dominant-baseline="central">THE UNIFIED CELL ARENA</text>
  </g>
  <g class="shape inner">
    <rect x="121.15" y="60" width="395.5" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="318.9" y="70" class="label-text" text-anchor="middle" dominant-baseline="central">32B Hash : Left 32B | Right 32B | Raw Bytes</text>
  </g>
  <g class="shape inner">
    <rect x="98.25" y="126" width="160.8" height="20" rx="10" ry="10" class="stadium-pill"/>
    <text x="178.65" y="136" class="label-text" text-anchor="middle" dominant-baseline="central">Unresolved Hash?</text>
  </g>
  <g class="shape inner">
    <rect x="378.4" y="126" width="153" height="20" rx="10" ry="10" class="stadium-pill"/>
    <text x="454.9" y="136" class="label-text" text-anchor="middle" dominant-baseline="central">Verified Bytes!</text>
  </g>
  <g class="shape inner">
    <rect x="19.15" y="214" width="140.5" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="89.4" y="224" class="label-text" text-anchor="middle" dominant-baseline="central">Local Fuel Step</text>
  </g>
  <g class="shape inner">
    <rect x="223.15" y="214" width="132" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="289.15" y="224" class="label-text" text-anchor="middle" dominant-baseline="central">UDP Wire Spill</text>
  </g>
  <g class="shape inner">
    <rect x="478.15" y="214" width="157.5" height="20" rx="3" ry="3" class="rect-pill"/>
    <text x="556.9" y="224" class="label-text" text-anchor="middle" dominant-baseline="central">UDP Packet Ingest</text>
  </g>
  <g class="shape inner">
    <rect x="15" y="236" width="199.8" height="20" rx="10" ry="10" class="stadium-pill"/>
    <text x="114.9" y="246" class="label-text" text-anchor="middle" dominant-baseline="central">Reduce Graph In-Place</text>
  </g>
  <g class="shape inner">
    <rect x="218.4" y="236" width="133" height="20" rx="10" ry="10" class="stadium-pill"/>
    <text x="284.9" y="246" class="label-text" text-anchor="middle" dominant-baseline="central">Emit 32B Want</text>
  </g>
  <g class="shape inner">
    <rect x="313.55" y="324" width="223.2" height="20" rx="10" ry="10" class="stadium-pill"/>
    <text x="425.15" y="334" class="label-text" text-anchor="middle" dominant-baseline="central">On Trap: Synthesize Cell</text>
  </g>
  <line x1="72.4" y1="180" x2="293.4" y2="180" class="bus-line"/>
  <line x1="344.4" y1="180" x2="565.4" y2="180" class="bus-line"/>
  <line x1="527.15" y1="246" x2="542.15" y2="246" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="72.4" y1="290" x2="565.4" y2="290" class="bus-line"/>
  <line x1="72.4" y1="180" x2="72.4" y2="212" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="72.4" y1="256" x2="72.4" y2="290" class="bus-line"/>
  <line x1="182.9" y1="103" x2="182.9" y2="126" class="bus-line"/>
  <line x1="182.9" y1="146" x2="182.9" y2="180" class="bus-line"/>
  <line x1="293.4" y1="180" x2="293.4" y2="212" class="arrow-line" marker-end="url(#arrow)"/>
  <line x1="293.4" y1="256" x2="293.4" y2="290" class="bus-line"/>
  <line x1="344.4" y1="180" x2="344.4" y2="214" class="bus-line"/>
  <line x1="429.4" y1="290" x2="429.4" y2="324" class="bus-line"/>
  <line x1="454.9" y1="103" x2="454.9" y2="126" class="bus-line"/>
  <line x1="454.9" y1="146" x2="454.9" y2="180" class="bus-line"/>
  <line x1="565.4" y1="180" x2="565.4" y2="214" class="bus-line"/>
  <line x1="565.4" y1="290" x2="565.4" y2="236" class="arrow-line" marker-end="url(#arrow)"/>
  <text x="476.15" y="246" class="annotation-text" text-anchor="start" dominant-baseline="central">(Hash</text>
  <text x="552.65" y="246" class="annotation-text" text-anchor="start" dominant-baseline="central">Write Arena)</text>
</svg>
